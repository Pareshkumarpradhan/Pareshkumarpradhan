<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2F81F7"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfe3ff"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 700 54px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: url(#txt); animation: fade 1.2s ease-out both; }
    .sub { font: 500 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #b9d4ff; letter-spacing: 1px; animation: fade 1.2s ease-out .4s both; }
    .wave1 { animation: drift 8s ease-in-out infinite alternate; }
    .wave2 { animation: drift 11s ease-in-out infinite alternate-reverse; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
  </style>
  <rect width="1200" height="240" rx="14" fill="url(#bg)"/>
  <g opacity="0.18" fill="#ffffff">
    <circle cx="90" cy="50" r="2"/><circle cx="210" cy="30" r="1.5"/><circle cx="330" cy="70" r="2"/>
    <circle cx="880" cy="40" r="2"/><circle cx="1010" cy="70" r="1.5"/><circle cx="1120" cy="35" r="2"/>
    <circle cx="560" cy="25" r="1.5"/><circle cx="700" cy="55" r="1.5"/>
  </g>
  <path class="wave1" d="M0 185 C 150 150, 300 220, 450 190 S 750 150, 900 185 S 1150 215, 1300 180 L1300 240 L0 240 Z" fill="#ffffff" opacity="0.08"/>
  <path class="wave2" d="M0 205 C 200 180, 350 235, 550 205 S 850 175, 1050 205 S 1250 225, 1300 210 L1300 240 L0 240 Z" fill="#ffffff" opacity="0.12"/>
  <text x="600" y="108" text-anchor="middle" class="title">Paresh Kumar Pradhan</text>
  <text x="600" y="152" text-anchor="middle" class="sub">FULL STACK &amp; GENAI DEVELOPER  •  AI AGENTS  •  RAG  •  WEB APPS</text>
</svg>
